---
name: Close Stale Issues
description: GitHub Action that closes stale issues after a period of inactivity.

inputs:
  days-before-stale:
    description: Number of days without activity before marking as stale.
    required: false
    default: "14"
  days-before-close:
    description: Number of days after being marked stale before closing. Set to 0 to close immediately.
    required: false
    default: "0"
  stale-issue-label:
    description: Label to add to mark issues as stale.
    required: false
    default: "stale"
  close-issue-message:
    description: Message to post when closing a stale issue.
    required: false
    default: "This issue has been automatically closed because it has been inactive for more than 2 weeks without any activity."
  operations-per-run:
    description: Maximum number of operations per run.
    required: false
    default: "100"

runs:
  using: composite
  steps:
    - name: Close stale issues
      uses: actions/stale@v9
      with:
        days-before-stale: ${{ inputs.days-before-stale }}
        days-before-close: ${{ inputs.days-before-close }}
        stale-issue-label: ${{ inputs.stale-issue-label }}
        close-issue-message: ${{ inputs.close-issue-message }}
        operations-per-run: ${{ inputs.operations-per-run }}
        remove-stale-when-updated: true
        only-labels: ''
